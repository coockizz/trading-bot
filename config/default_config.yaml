# Configuration de reference. Les valeurs de risque sont celles de la spec.
# ATTENTION : avec capital_usdt=500 et max_position_size_pct=0.5, la position
# maximale autorisee est de 2.50 USDT, soit moins que le notional minimum de
# Binance (~100 USDT). Le bot refusera de demarrer avec un message explicite.
# Utilise config/binance_testnet.yaml pour une configuration reellement
# executable, ou remonte max_position_size_pct (voir README, section Risque).

exchange:
  name: binance
  api_key_env: BINANCE_API_KEY
  api_secret_env: BINANCE_API_SECRET
  testnet: true
  maker_fee_pct: 0.02      # Binance Futures VIP0, ordres limites
  taker_fee_pct: 0.05      # Binance Futures VIP0, ordres au marche
  recv_window_ms: 5000

symbol: BTCUSDT

# Verrou de securite : passer a false est une action volontaire et consciente.
dry_run: true

strategy:
  type: grid
  price_range:
    lower: 90000
    upper: 110000
  num_grids: 50
  capital_usdt: 500
  leverage: 1              # > 1 est refuse sous 1000 USDT de capital
  spacing: geometric       # profit constant en % par niveau
  active_orders_per_side: 10

risk:
  max_daily_drawdown_pct: 2.0
  stop_loss_pct: 5.0
  max_position_size_pct: 0.5

logging:
  level: INFO
  file: logs/bot.log
  max_bytes: 10485760      # rotation a 10 Mo
  backup_count: 5

runtime:
  reconcile_interval_s: 5.0
  state_file: state/bot_state.json
  stats_file: state/stats.json
