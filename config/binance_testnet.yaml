# Configuration testnet prete a lancer. Aucun fonds reel n'est engage.
# Differences avec default_config.yaml : moins de niveaux (pour respecter le
# notional minimum) et une taille de position exploitable.

exchange:
  name: binance
  api_key_env: BINANCE_API_KEY
  api_secret_env: BINANCE_API_SECRET
  testnet: true
  maker_fee_pct: 0.02
  taker_fee_pct: 0.05
  recv_window_ms: 5000

symbol: BTCUSDT

dry_run: true

strategy:
  type: grid
  price_range:
    lower: 90000
    upper: 110000
  # 10 niveaux sur 90k-110k = 2.26% d'ecart par niveau, soit ~2.16% net de
  # frais aller-retour. Avec 3000 USDT cela fait 300 USDT par niveau : au-dessus
  # du minimum Binance (100 USDT) meme apres arrondi au step de 0.001 BTC.
  num_grids: 10
  capital_usdt: 3000
  leverage: 1
  spacing: geometric
  active_orders_per_side: 3

risk:
  max_daily_drawdown_pct: 2.0
  stop_loss_pct: 5.0
  # 40% du capital = 1200 USDT : couvre les 3 niveaux actifs a 300 USDT chacun
  # tout en plafonnant l'exposition. Voir README, section Risque.
  max_position_size_pct: 40.0

logging:
  level: INFO
  file: logs/bot.log
  max_bytes: 10485760
  backup_count: 5

runtime:
  reconcile_interval_s: 5.0
  state_file: state/bot_state.json
  stats_file: state/stats.json
